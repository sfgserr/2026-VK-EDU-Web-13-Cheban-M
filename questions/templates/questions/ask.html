{% extends 'core/base.html' %}

{% block title %}Задать вопрос — Forum{% endblock %}

{% block content %}
<h1 class="mb-4">Задать вопрос</h1>
<form class="form-narrow" action="{% url 'ask' %}" method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label for="title" class="form-label">Заголовок</label>
    <input type="text" class="form-control" id="title" name="title" maxlength="150">
    <div class="form-text">Не более 150 символов.</div>
  </div>
  <div class="mb-3">
    <label for="text" class="form-label">Текст</label>
    <textarea class="form-control is-invalid" id="text" name="text" rows="6" maxlength="5000"></textarea>
    <div class="invalid-feedback">Введите текст вопроса.</div>
    <div class="form-text">Не более 5000 символов.</div>
  </div>
  <div class="mb-3">
    <label for="tags" class="form-label">Теги</label>
    <input type="text" class="form-control" id="tags" name="tags" maxlength="100">
    <div class="form-text">Через запятую, не более 3 тегов.</div>
  </div>
  <button type="submit" class="btn btn-primary">Спросить</button>
</form>
{% endblock %}
