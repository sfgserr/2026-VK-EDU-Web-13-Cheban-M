{% extends 'core/base.html' %}
{% load static %}

{% block title %}Настройки — Forum{% endblock %}

{% block content %}
<h1 class="mb-4">Настройки: Dr. Pepper</h1>
<form class="form-narrow" action="{% url 'profile' %}" method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="alert alert-danger">Изменения не сохранены. Исправьте ошибки.</div>
  <div class="mb-3">
    <label for="login" class="form-label">Логин</label>
    <input type="text" class="form-control" id="login" name="login" maxlength="30" value="dr_pepper">
  </div>
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control is-invalid" id="email" name="email" maxlength="254" value="dr.pepper@">
    <div class="invalid-feedback">Введите корректный email.</div>
  </div>
  <div class="mb-3">
    <label for="nickname" class="form-label">Никнейм</label>
    <input type="text" class="form-control" id="nickname" name="nickname" maxlength="50" value="Dr. Pepper">
    <div class="form-text">Не более 50 символов.</div>
  </div>
  <div class="mb-3">
    <label for="avatar" class="form-label d-block">Аватар</label>
    <img src="{% static 'core/img/avatar.svg' %}" class="avatar-lg rounded mb-2" alt="Аватар">
    <input type="file" class="form-control" id="avatar" name="avatar" accept="image/*">
    <div class="form-text">JPG или PNG, не более 2 МБ.</div>
  </div>
  <button type="submit" class="btn btn-primary">Сохранить</button>
</form>
{% endblock %}
