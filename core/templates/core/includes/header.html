<header class="border-bottom bg-white">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand fs-3 fw-bold" href="{% url 'index' %}">Forum</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Меню">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse gap-3 py-2 py-lg-0" id="nav">
        <form class="flex-grow-1" action="{% url 'index' %}">
          <input class="form-control" type="search" name="q" placeholder="Поиск" maxlength="100">
        </form>
        {% if user.is_authenticated %}
          <a class="btn btn-success my-2 my-lg-0" href="{% url 'ask' %}">Задать вопрос</a>
          <div class="d-flex align-items-center gap-2">
            {% include 'core/includes/avatar.html' with account=user image_class='avatar-sm' %}
            <div>
              <div class="fw-bold">{{ user.first_name|default:user.username }}</div>
              <a href="{% url 'profile' %}" class="me-2">Настройки</a>
              <form class="d-inline" action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.get_full_path }}">
                <button class="btn btn-link p-0 align-baseline" type="submit">Выйти</button>
              </form>
            </div>
          </div>
        {% else %}
          <span title="Войдите, чтобы задать вопрос">
            <button class="btn btn-success my-2 my-lg-0" type="button" disabled>Задать вопрос</button>
          </span>
          <div class="d-flex gap-3">
            <a href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}">Войти</a>
            <a href="{% url 'signup' %}">Регистрация</a>
          </div>
        {% endif %}
      </div>
    </div>
  </nav>
</header>
