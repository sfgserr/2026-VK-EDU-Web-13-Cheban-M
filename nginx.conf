server {
    listen 80;
    client_max_body_size 3m;

    location /media/ {
        alias /app/media/;
        add_header X-Content-Type-Options nosniff;
    }

    location /static/ {
        alias /app/static/;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_pass http://web:8000;
    }
}
