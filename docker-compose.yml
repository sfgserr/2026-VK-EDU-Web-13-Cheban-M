x-django: &django
  build: .
  env_file: .env.docker
  environment:
    ENV_FILE: .env.docker
    DB_HOST: db
    REDIS_HOST: redis
    REDIS_PORT: 6379
    CENTRIFUGO_API_URL: http://centrifugo:8000/api
    EMAIL_HOST: maildev
    EMAIL_PORT: 1025
  volumes:
    - .:/app
    - media:/app/media

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-forum}
      POSTGRES_USER: ${DB_USER:-forum}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  centrifugo:
    image: centrifugo/centrifugo:v6.4.0
    command: centrifugo -c /centrifugo/config.json
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: "${CENTRIFUGO_TOKEN_SECRET:-}"
      CENTRIFUGO_HTTP_API_KEY: "${CENTRIFUGO_API_KEY:-}"
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:8000 http://127.0.0.1:8000 http://localhost:8080 http://127.0.0.1:8080}"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./centrifugo.json:/centrifugo/config.json:ro
  maildev:
    image: maildev/maildev:2.2.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:1080:1080"
  web:
    <<: *django
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media:/app/media
      - static_files:/app/static
  celery:
    <<: *django
    command: celery -A application worker --loglevel=info --concurrency=2
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_started
      maildev:
        condition: service_started
  celerybeat:
    <<: *django
    command: celery -A application beat --loglevel=info
    depends_on:
      celery:
        condition: service_started
      redis:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    profiles: [nginx]
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media:ro
      - static_files:/app/static:ro

volumes:
  media:
  postgres_data:
  static_files:
  redis_data:
